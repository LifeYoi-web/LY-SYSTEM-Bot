name: Build LY Focus APK

# يبني ملف APK جاهز للتثبيت على الأندرويد.
# يشتغل تلقائيًا عند أي تعديل داخل مجلد lyfocus، أو يدويًا من تبويب Actions.
on:
  push:
    branches: ["**"]
    paths:
      - "lyfocus/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyfocus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare brand icon (jpg -> png)
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          mkdir -p resources
          convert resources/logo.jpg -resize 1024x1024^ -gravity center -extent 1024x1024 resources/icon.png
          # خلفية سوداء للسبلاش بشعار في النص
          convert -size 2732x2732 xc:'#0a0a0a' resources/logo.jpg -resize 900x900 -gravity center -composite resources/splash.png

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons & splash from brand
        run: npx @capacitor/assets generate --android || echo "assets step skipped"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LY-Focus.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LY-Focus-APK
          path: lyfocus/LY-Focus.apk
          if-no-files-found: error
