<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0a0a" />
<title>LY Focus — تركيز</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/logo.jpg" />
<style>
  :root{
    --orange:#f57c00; --orange-2:#ff9d2e; --glow:rgba(245,124,0,.55);
    --bg:#0a0a0a; --bg-2:#141414; --card:#181818; --card-2:#1f1f1f;
    --line:#2a2a2a; --txt:#f3f3f3; --muted:#9a9a9a; --green:#3ecf6b; --red:#ff5a5a;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;}
  body{padding-bottom:84px; min-height:100vh;
    background:
      radial-gradient(900px 380px at 80% -8%, rgba(245,124,0,.16), transparent 60%),
      radial-gradient(700px 320px at -10% 12%, rgba(245,124,0,.10), transparent 55%),
      var(--bg);}
  ::-webkit-scrollbar{width:0;}
  button{font-family:inherit; cursor:pointer;}
  .hidden{display:none !important;}

  /* Header */
  header{position:sticky; top:0; z-index:30; padding:14px 16px calc(14px + env(safe-area-inset-top));
    padding-top:calc(14px + env(safe-area-inset-top));
    background:linear-gradient(180deg, rgba(10,10,10,.95), rgba(10,10,10,.7) 70%, transparent);
    backdrop-filter:blur(8px); display:flex; align-items:center; gap:12px;}
  .brand{display:flex; align-items:center; gap:11px;}
  .brand img{width:42px; height:42px; border-radius:12px; object-fit:cover;
    box-shadow:0 0 0 1px var(--line), 0 0 22px var(--glow);}
  .brand .t{font-weight:800; font-size:18px; letter-spacing:.5px;}
  .brand .t span{color:var(--orange);}
  .brand .s{font-size:11px; color:var(--muted); margin-top:1px;}
  .clockbox{margin-inline-start:auto; text-align:center; line-height:1;}
  .clockbox .time{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums;
    color:#fff; text-shadow:0 0 16px var(--glow);}
  .clockbox .date{font-size:11px; color:var(--muted); margin-top:4px;}

  main{padding:6px 16px 20px; max-width:680px; margin:0 auto;}
  .page{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  h2.title{font-size:16px; margin:18px 2px 10px; color:#fff; display:flex; align-items:center; gap:8px;}
  h2.title .dot{width:8px; height:8px; border-radius:50%; background:var(--orange); box-shadow:0 0 10px var(--glow);}
  .muted{color:var(--muted);}

  .card{background:linear-gradient(180deg,var(--card),var(--bg-2)); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .card.glow{box-shadow:0 0 0 1px rgba(245,124,0,.25), 0 10px 40px -18px var(--glow);}

  /* Buttons / inputs */
  .btn{border:none; border-radius:14px; padding:13px 16px; font-weight:700; font-size:15px;
    background:var(--card-2); color:var(--txt); border:1px solid var(--line);}
  .btn.primary{background:linear-gradient(180deg,var(--orange-2),var(--orange)); color:#1a1200;
    border:none; box-shadow:0 8px 26px -10px var(--glow);}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%;}
  .btn.sm{padding:8px 12px; font-size:13px; border-radius:11px;}
  .row{display:flex; gap:10px;}
  input,select,textarea{width:100%; background:#101010; border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:12px 13px; font-size:15px; font-family:inherit; outline:none;}
  input:focus,select,textarea:focus{border-color:var(--orange);}
  label.lbl{font-size:12px; color:var(--muted); display:block; margin:0 2px 6px;}

  /* Focus timer */
  .timer-wrap{display:flex; flex-direction:column; align-items:center; gap:14px; padding:8px 0 4px;}
  .ring{position:relative; width:236px; height:236px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring .big{font-size:52px; font-weight:800; font-variant-numeric:tabular-nums; text-shadow:0 0 22px var(--glow);}
  .ring .lab{font-size:13px; color:var(--muted); margin-top:2px;}
  .modes{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .chip{padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card);
    font-size:13px; font-weight:700; color:var(--muted);}
  .chip.active{background:rgba(245,124,0,.16); color:var(--orange-2); border-color:rgba(245,124,0,.5);}
  .stat-strip{display:flex; gap:10px;}
  .stat-strip .s{flex:1; text-align:center; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:10px 6px;}
  .stat-strip .s b{display:block; font-size:22px; color:var(--orange-2);}
  .stat-strip .s span{font-size:11px; color:var(--muted);}

  /* Lists */
  .item{display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; margin-bottom:10px;}
  .item .check{width:26px; height:26px; border-radius:8px; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; transition:.15s;}
  .item.done .check{background:var(--green); border-color:var(--green);}
  .item.done .check::after{content:"✓"; color:#06210f; font-weight:900; font-size:15px;}
  .item .body{flex:1; min-width:0;}
  .item .body .ttl{font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item.done .body .ttl{text-decoration:line-through; color:var(--muted);}
  .item .body .meta{font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
  .tag{font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(245,124,0,.14); color:var(--orange-2);}
  .tag.p1{background:rgba(255,90,90,.16); color:#ff8a8a;}
  .del{color:var(--muted); background:none; border:none; font-size:20px; padding:4px 6px; line-height:1;}

  /* Habit grid */
  .habit{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; margin-bottom:10px;}
  .habit .ic{width:40px; height:40px; border-radius:11px; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; font-size:20px; background:rgba(245,124,0,.12);}
  .habit .body{flex:1; min-width:0;}
  .habit .body .ttl{font-weight:700; font-size:15px;}
  .habit .body .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .streak{font-size:12px; color:var(--orange-2); font-weight:800; display:flex; align-items:center; gap:3px;}
  .toggle{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:transparent; flex-shrink:0;}
  .toggle.on{background:var(--green); border-color:var(--green); color:#06210f; font-weight:900;}

  /* Advice cards */
  .advice{border-radius:16px; padding:15px; margin-bottom:12px; border:1px solid var(--line);}
  .advice.keep{background:linear-gradient(180deg, rgba(62,207,107,.10), transparent); border-color:rgba(62,207,107,.3);}
  .advice.change{background:linear-gradient(180deg, rgba(245,124,0,.10), transparent); border-color:rgba(245,124,0,.32);}
  .advice h4{margin:0 0 6px; font-size:15px; display:flex; align-items:center; gap:8px;}
  .advice p{margin:0; font-size:13.5px; line-height:1.7; color:#d8d8d8;}
  .advice .how{margin-top:8px; font-size:12.5px; color:var(--muted); border-top:1px dashed var(--line); padding-top:8px;}

  .empty{text-align:center; color:var(--muted); padding:26px 10px; font-size:14px;}

  /* Bottom nav */
  nav{position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:rgba(16,16,16,.92); backdrop-filter:blur(12px); border-top:1px solid var(--line);
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); justify-content:space-around;}
  nav button{background:none; border:none; color:var(--muted); display:flex; flex-direction:column;
    align-items:center; gap:3px; font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:12px; flex:1;}
  nav button .ico{font-size:21px; line-height:1;}
  nav button.active{color:var(--orange-2);}
  nav button.active .ico{filter:drop-shadow(0 0 8px var(--glow));}

  .fab{position:fixed; bottom:calc(86px + env(safe-area-inset-bottom)); inset-inline-start:auto; inset-inline-end:18px;
    width:56px; height:56px; border-radius:50%; border:none; z-index:35;
    background:linear-gradient(180deg,var(--orange-2),var(--orange)); color:#1a1200; font-size:30px; font-weight:800;
    box-shadow:0 10px 30px -8px var(--glow);}

  /* Modal */
  .overlay{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.6); backdrop-filter:blur(4px);
    display:flex; align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:680px; background:var(--bg-2); border:1px solid var(--line);
    border-radius:22px 22px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); animation:up .25s ease;}
  @keyframes up{from{transform:translateY(100%);} to{transform:none;}}
  .sheet h3{margin:2px 2px 14px; font-size:17px;}
  .sheet .grp{margin-bottom:12px;}
  .toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:80;
    background:var(--card-2); border:1px solid var(--orange); color:#fff; padding:11px 18px; border-radius:999px;
    font-size:14px; font-weight:700; box-shadow:0 8px 30px -8px var(--glow); animation:fade .2s ease;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="assets/logo.jpg" alt="LY" />
    <div>
      <div class="t">LY <span>Focus</span></div>
      <div class="s">إدارة وقتك بانضباط</div>
    </div>
  </div>
  <div class="clockbox">
    <div class="time" id="liveTime">00:00</div>
    <div class="date" id="liveDate">—</div>
  </div>
</header>

<main id="app"></main>

<button class="fab hidden" id="fab" onclick="openAdd()">+</button>

<nav>
  <button data-tab="today" class="active" onclick="go('today')"><span class="ico">🗓️</span>اليوم</button>
  <button data-tab="focus" onclick="go('focus')"><span class="ico">⏱️</span>تركيز</button>
  <button data-tab="habits" onclick="go('habits')"><span class="ico">🔥</span>عاداتي</button>
  <button data-tab="guide" onclick="go('guide')"><span class="ico">🧭</span>دليلك</button>
  <button data-tab="more" onclick="go('more')"><span class="ico">⚙️</span>المزيد</button>
</nav>

<script>
/* ============================ تخزين البيانات ============================ */
const DB = {
  load(k, d){ try{ return JSON.parse(localStorage.getItem('lyf_'+k)) ?? d; }catch(e){ return d; } },
  save(k, v){ localStorage.setItem('lyf_'+k, JSON.stringify(v)); },
};
const todayKey = () => new Date().toISOString().slice(0,10);

let tasks   = DB.load('tasks', []);
let habits  = DB.load('habits', null);
let settings= DB.load('settings', { chime:false, vibrate:true, focusMin:25, breakMin:5, longMin:15 });
let focusStats = DB.load('focusStats', { date: todayKey(), sessions:0, minutes:0 });

if(focusStats.date !== todayKey()){ focusStats = { date: todayKey(), sessions:0, minutes:0 }; DB.save('focusStats', focusStats); }

/* عادات مقترحة جاهزة (يقدر يفعّلها بضغطة) */
if(habits === null){
  habits = [
    { id:id(), icon:'🌅', name:'أصحى بوقت ثابت كل يوم', note:'ثبّت نقطة بداية ليومك', log:{}, on:true },
    { id:id(), icon:'📝', name:'خطّط لـ3 مهام فقط قبل النوم', note:'لا تبدأ يومك بدون خطة', log:{}, on:true },
    { id:id(), icon:'📵', name:'أول ساعة بدون جوال', note:'لا تبدأ يومك بالتشتت', log:{}, on:true },
    { id:id(), icon:'⏱️', name:'جلسة تركيز واحدة 25 دقيقة', note:'ابدأ صغير ثم زِد', log:{}, on:true },
    { id:id(), icon:'💧', name:'أشرب ماء أول ما أصحى', note:'عادة سهلة تبني السلسلة', log:{}, on:false },
    { id:id(), icon:'🚶', name:'مشي 15 دقيقة', note:'حركة تصفّي ذهنك', log:{}, on:false },
    { id:id(), icon:'🌙', name:'أغلق الشاشات قبل النوم بساعة', note:'نوم أحسن = وقت أحسن', log:{}, on:false },
  ];
  DB.save('habits', habits);
}

function id(){ return Math.random().toString(36).slice(2,9); }
function persist(){ DB.save('tasks', tasks); DB.save('habits', habits); DB.save('settings', settings); DB.save('focusStats', focusStats); }

/* ============================ ساعة حيّة + جرس الساعة ============================ */
const arDays = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const arMon = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
let lastHour = new Date().getHours();
function tick(){
  const n = new Date();
  const hh = String(n.getHours()).padStart(2,'0');
  const mm = String(n.getMinutes()).padStart(2,'0');
  document.getElementById('liveTime').textContent = `${hh}:${mm}`;
  document.getElementById('liveDate').textContent = `${arDays[n.getDay()]} ${n.getDate()} ${arMon[n.getMonth()]}`;
  if(n.getHours() !== lastHour){
    lastHour = n.getHours();
    if(settings.chime){ notify('🔔 ساعة جديدة', `الوقت الآن ${hh}:${mm} — وين وصلت في مهامك؟`); buzz([120,60,120]); }
  }
}
setInterval(tick, 1000); tick();

/* ============================ تنبيهات / اهتزاز ============================ */
function notify(title, body){
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification(title, { body, icon:'assets/logo.jpg' }); }catch(e){}
  } else { toast(title.replace(/^[^ ]+ /,'')); }
}
function buzz(p){ if(settings.vibrate && navigator.vibrate) navigator.vibrate(p); }
let toastT;
function toast(msg){
  clearTimeout(toastT);
  let el = document.querySelector('.toast');
  if(!el){ el = document.createElement('div'); el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;
  toastT = setTimeout(()=> el.remove(), 2200);
}

/* ============================ التنقل ============================ */
let tab = 'today';
function go(t){
  tab = t;
  document.querySelectorAll('nav button').forEach(b=> b.classList.toggle('active', b.dataset.tab===t));
  document.getElementById('fab').classList.toggle('hidden', !(t==='today' || t==='habits'));
  render();
}

/* ============================ العرض ============================ */
function render(){
  const app = document.getElementById('app');
  if(tab==='today')  app.innerHTML = viewToday();
  if(tab==='focus')  { app.innerHTML = viewFocus(); paintRing(); }
  if(tab==='habits') app.innerHTML = viewHabits();
  if(tab==='guide')  app.innerHTML = viewGuide();
  if(tab==='more')   app.innerHTML = viewMore();
}

/* ---- اليوم ---- */
function viewToday(){
  const list = tasks.filter(t=> t.date===todayKey());
  const done = list.filter(t=>t.done).length;
  const totMin = list.reduce((a,t)=> a + (t.min||0), 0);
  const pct = list.length ? Math.round(done/list.length*100) : 0;
  let h = `<div class="page">
    <div class="card glow">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:13px" class="muted">إنجاز اليوم</div>
        <div style="font-size:30px;font-weight:800">${pct}%</div></div>
        <div style="text-align:left">
          <div class="muted" style="font-size:12px">${done} من ${list.length} مهمة</div>
          <div class="muted" style="font-size:12px">${totMin} دقيقة مخطّطة</div>
        </div>
      </div>
      <div style="height:9px;background:#101010;border-radius:9px;margin-top:12px;overflow:hidden;border:1px solid var(--line)">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--orange),var(--orange-2));transition:.4s"></div>
      </div>
    </div>
    <h2 class="title"><span class="dot"></span> مهام اليوم</h2>`;
  if(!list.length){
    h += `<div class="empty">ما عندك مهام لليوم.<br/>اضغط زر <b style="color:var(--orange-2)">+</b> وابدأ بمهمة وحدة فقط.</div>`;
  } else {
    list.sort((a,b)=> (a.done-b.done) || (a.time||'').localeCompare(b.time||''));
    for(const t of list){
      h += `<div class="item ${t.done?'done':''}">
        <div class="check" onclick="toggleTask('${t.id}')"></div>
        <div class="body" onclick="toggleTask('${t.id}')">
          <div class="ttl">${esc(t.title)}</div>
          <div class="meta">
            ${t.time?`<span class="tag">⏰ ${t.time}</span>`:''}
            ${t.min?`<span>${t.min} دقيقة</span>`:''}
            ${t.pr==1?'<span class="tag p1">مهم</span>':''}
          </div>
        </div>
        <button class="del" onclick="delTask('${t.id}')">×</button>
      </div>`;
    }
  }
  h += `</div>`;
  return h;
}
function toggleTask(tid){
  const t = tasks.find(x=>x.id===tid); if(!t) return;
  t.done = !t.done; persist();
  if(t.done){ buzz(40); toast('أحسنت ✅'); }
  render();
}
function delTask(tid){ tasks = tasks.filter(x=>x.id!==tid); persist(); render(); }

/* ---- العادات ---- */
function viewHabits(){
  const k = todayKey();
  const active = habits.filter(h=>h.on);
  let h = `<div class="page">
    <h2 class="title"><span class="dot"></span> عاداتي اليومية</h2>
    <div class="muted" style="font-size:13px;margin:0 2px 12px">علّم العادة لما تسوّيها — والسلسلة 🔥 تكبر كل يوم تلتزم فيه.</div>`;
  if(!active.length){
    h += `<div class="empty">ما عندك عادات مفعّلة.<br/>فعّل عادة من القائمة تحت أو من "دليلك".</div>`;
  }
  for(const hb of active){
    const on = !!hb.log[k];
    const s = streak(hb);
    h += `<div class="habit">
      <div class="ic">${hb.icon}</div>
      <div class="body">
        <div class="ttl">${esc(hb.name)}</div>
        <div class="meta">${esc(hb.note||'')}</div>
      </div>
      ${s>0?`<div class="streak">🔥 ${s}</div>`:''}
      <button class="toggle ${on?'on':''}" onclick="toggleHabit('${hb.id}')">${on?'✓':''}</button>
    </div>`;
  }
  // العادات غير المفعّلة
  const off = habits.filter(h=>!h.on);
  if(off.length){
    h += `<h2 class="title" style="margin-top:22px"><span class="dot"></span> عادات مقترحة (مطفأة)</h2>`;
    for(const hb of off){
      h += `<div class="habit" style="opacity:.7">
        <div class="ic">${hb.icon}</div>
        <div class="body"><div class="ttl">${esc(hb.name)}</div><div class="meta">${esc(hb.note||'')}</div></div>
        <button class="btn sm" onclick="enableHabit('${hb.id}')">تفعيل</button>
      </div>`;
    }
  }
  h += `</div>`;
  return h;
}
function toggleHabit(hid){
  const hb = habits.find(x=>x.id===hid); if(!hb) return;
  const k = todayKey();
  hb.log[k] = !hb.log[k]; if(!hb.log[k]) delete hb.log[k];
  persist();
  if(hb.log[k]){ buzz(40); toast('سلسلة مستمرة 🔥'); }
  render();
}
function enableHabit(hid){ const hb=habits.find(x=>x.id===hid); if(hb){hb.on=true; persist(); render();} }
function streak(hb){
  let s=0; const d=new Date();
  for(;;){ const k=d.toISOString().slice(0,10); if(hb.log[k]){ s++; d.setDate(d.getDate()-1); } else break; if(s>999) break; }
  return s;
}

/* ============================ مؤقّت التركيز ============================ */
let timer = { mode:'focus', remain: settings.focusMin*60, total: settings.focusMin*60, running:false, int:null };
function modeMins(m){ return m==='focus'?settings.focusMin : m==='break'?settings.breakMin : settings.longMin; }
function setMode(m){
  timer.mode=m; timer.total=modeMins(m)*60; timer.remain=timer.total; timer.running=false;
  clearInterval(timer.int); render();
}
function viewFocus(){
  const lab = timer.mode==='focus'?'وقت تركيز' : timer.mode==='break'?'استراحة قصيرة':'استراحة طويلة';
  return `<div class="page">
    <div class="card glow">
      <div class="modes" style="margin-bottom:10px">
        <button class="chip ${timer.mode==='focus'?'active':''}" onclick="setMode('focus')">تركيز ${settings.focusMin}د</button>
        <button class="chip ${timer.mode==='break'?'active':''}" onclick="setMode('break')">استراحة ${settings.breakMin}د</button>
        <button class="chip ${timer.mode==='long'?'active':''}" onclick="setMode('long')">طويلة ${settings.longMin}د</button>
      </div>
      <div class="timer-wrap">
        <div class="ring">
          <svg width="236" height="236">
            <circle cx="118" cy="118" r="106" stroke="#1f1f1f" stroke-width="14" fill="none"/>
            <circle id="prog" cx="118" cy="118" r="106" stroke="url(#g)" stroke-width="14" fill="none"
              stroke-linecap="round" stroke-dasharray="666" stroke-dashoffset="0"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff9d2e"/><stop offset="1" stop-color="#f57c00"/>
            </linearGradient></defs>
          </svg>
          <div class="center">
            <div class="big" id="tDisp">${fmt(timer.remain)}</div>
            <div class="lab">${lab}</div>
          </div>
        </div>
        <div class="row" style="width:100%;max-width:320px">
          <button class="btn primary block" id="startBtn" onclick="toggleTimer()">${timer.running?'إيقاف مؤقت':'ابدأ'}</button>
          <button class="btn" onclick="resetTimer()" style="flex:0 0 56px">↺</button>
        </div>
      </div>
    </div>
    <h2 class="title"><span class="dot"></span> إنجاز اليوم</h2>
    <div class="stat-strip">
      <div class="s"><b>${focusStats.sessions}</b><span>جلسة تركيز</span></div>
      <div class="s"><b>${focusStats.minutes}</b><span>دقيقة تركيز</span></div>
      <div class="s"><b>${Math.floor(focusStats.minutes/60)}س ${focusStats.minutes%60}د</b><span>إجمالي</span></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div style="font-size:13.5px;line-height:1.7;color:#d8d8d8">
        💡 <b>طريقة بومودورو:</b> ركّز ${settings.focusMin} دقيقة على مهمة وحدة بدون جوال، بعدها استراحة قصيرة.
        كل 4 جلسات خذ استراحة طويلة. الفكرة إنك تحسّ بالوقت يمشي بدل ما يضيع منك.
      </div>
    </div>
  </div>`;
}
function paintRing(){
  const c = document.getElementById('prog'); if(!c) return;
  const len = 2*Math.PI*106;
  c.setAttribute('stroke-dasharray', len);
  const frac = timer.total ? timer.remain/timer.total : 0;
  c.setAttribute('stroke-dashoffset', len*(1-frac));
}
function fmt(s){ const m=Math.floor(s/60), x=s%60; return `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; }
function toggleTimer(){
  if(timer.running){ timer.running=false; clearInterval(timer.int); }
  else {
    if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
    timer.running=true;
    timer.int = setInterval(()=>{
      timer.remain--;
      const d=document.getElementById('tDisp'); if(d) d.textContent=fmt(timer.remain);
      paintRing();
      if(timer.remain<=0) finishTimer();
    }, 1000);
  }
  const b=document.getElementById('startBtn'); if(b) b.textContent = timer.running?'إيقاف مؤقت':'ابدأ';
}
function resetTimer(){ timer.running=false; clearInterval(timer.int); timer.remain=timer.total; render(); }
function finishTimer(){
  clearInterval(timer.int); timer.running=false;
  buzz([200,100,200,100,200]); beep();
  if(timer.mode==='focus'){
    focusStats.sessions++; focusStats.minutes += settings.focusMin; persist();
    notify('✅ خلّصت جلسة تركيز', 'خذ استراحة قصيرة الحين، تستاهل.');
    setMode('break');
  } else {
    notify('⏱️ خلصت الاستراحة', 'يلا نرجع نركّز!');
    setMode('focus');
  }
}
let actx;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18,0.36].forEach(t=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.001, actx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+t+0.15);
      o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.16);
    });
  }catch(e){}
}

/* ============================ دليلك (عادات تغيّر / تثبّت) ============================ */

    ['📱','تبدأ يومك بالجوال','أول 30 دقيقة بالسوشيال ميديا تخطف تركيزك لباقي اليوم.','خلّ الجوال بعيد عن السرير، وأول ساعة بدون شاشة. حط منبّه عادي بدل منبّه الجوال.'],
    ['🌀','تشتغل بدون خطة مكتوبة','اللي بدون خطة، يومه يمشيه غيره. تحس مشغول بس ما أنجزت.','كل ليلة اكتب 3 مهام فقط لبكرة. ثلاثة، مو أكثر. هذا أهم تغيير ممكن تسويه.'],
    ['⏳','ما تحس بالوقت يمشي','لأنك ما تقيسه. الوقت اللي ما ينقاس، يضيع.','استخدم مؤقّت التركيز في التطبيق. لما تشوف الوقت ينزل قدامك، تبدأ تحترمه.'],
    ['🔀','تسوي كل شي مرة وحدة','تنقّلك بين المهام يضيّع 40% من تركيزك بدون ما تدري.','مهمة وحدة كل جلسة. اقفل التابات الثانية. ركّز ثم انتقل.'],
    ['🌙','تسهر بدون هدف','السهر بدون سبب يأكل من يوم بكرة كامل.','حدد وقت "إغلاق" لليوم. بعده ممنوع شغل — راحة فقط.'],
  ];
  const keep = [
    ['💪','طموحك ورغبتك تتغيّر','إنك تطلب أداة وتعترف إنك تبي تتحسن — هذا نص الطريق. كثير ما يوصلون لهنا.'],
    ['🧠','وعيك بنقطة ضعفك','معرفتك إنك "سيء بالتوقيت" ميزة مو عيب — تقدر تشتغل على شي محدد.'],
    ['🎯','شغفك ببراندك (LY)','اهتمامك بهويتك وشعارك يدل إنك تنجز لما الشي يهمّك. وجّه نفس الطاقة لوقتك.'],
  ];
  let h = `<div class="page">
    <div class="card glow"><div style="font-size:14px;line-height:1.8;color:#eee">
      🧭 <b>خطتك بكل بساطة:</b> ما تحتاج تغيّر حياتك كلها مرة وحدة — هذا اللي يفشّل الناس.
      غيّر <b style="color:var(--orange-2)">عادة وحدة كل أسبوع</b> من القائمة تحت، وثبّت الأشياء الحلوة اللي عندك أصلاً.
    </div></div>
    <h2 class="title"><span class="dot"></span> عادات لازم تغيّرها</h2>`;
  for(const [ic,t,why,how] of change){
    h += `<div class="advice change">
      <h4>${ic} ${t}</h4><p>${why}</p>
      <div class="how">✅ الحل: ${how}</div>
    </div>`;
  }
  h += `<h2 class="title"><span class="dot"></span> أشياء خلّها زي ما هي</h2>`;
  for(const [ic,t,why] of keep){
    h += `<div class="advice keep"><h4>${ic} ${t}</h4><p>${why}</p></div>`;
  }
  h += `<div class="card" style="margin-top:6px"><div style="font-size:13.5px;line-height:1.8;color:#d8d8d8">
    📌 <b>قاعدة ذهبية:</b> ابدأ <u>أصغر</u> مما تتخيل. جلسة تركيز وحدة، مهمة وحدة، عادة وحدة.
    الالتزام الصغير المستمر يغلب الحماس الكبير المؤقت.

  return `<div class="page">
    <h2 class="title"><span class="dot"></span> إعدادات التركيز</h2>
    <div class="card">
      <div class="grp"><label class="lbl">مدة جلسة التركيز (دقيقة)</label>
        <input type="number" min="5" max="90" value="${settings.focusMin}" onchange="setS('focusMin',this.value)"/></div>

        <div style="flex:1"><label class="lbl">استراحة طويلة</label>
          <input type="number" min="5" max="45" value="${settings.longMin}" onchange="setS('longMin',this.value)"/></div>
      </div>
    </div>
    <h2 class="title"><span class="dot"></span> التنبيهات</h2>
    <div class="card">
      <div class="item" style="margin:0 0 10px">
        <div class="body"><div class="ttl">جرس بداية كل ساعة 🔔</div>
          <div class="meta">يذكّرك بمرور الوقت كل ساعة</div></div>
        <button class="toggle ${settings.chime?'on':''}" onclick="setS('chime',${!settings.chime})">${settings.chime?'✓':''}</button>
      </div>
      <div class="item" style="margin:0">
        <div class="body"><div class="ttl">الاهتزاز عند التنبيه 📳</div>
          <div class="meta">يهتز الجوال عند انتهاء الجلسة</div></div>
        <button class="toggle ${settings.vibrate?'on':''}" onclick="setS('vibrate',${!settings.vibrate})">${settings.vibrate?'✓':''}</button>
      </div>
      <button class="btn block" style="margin-top:12px" onclick="askNotif()">تفعيل إشعارات النظام</button>
    </div>
    <h2 class="title"><span class="dot"></span> بياناتك</h2>
    <div class="card">
      <div class="row">
        <button class="btn block" onclick="exportData()">💾 نسخة احتياطية</button>
        <button class="btn block" onclick="document.getElementById('imp').click()">📥 استرجاع</button>
      </div>
      <input id="imp" type="file" accept="application/json" class="hidden" onchange="importData(this)"/>
      <button class="btn ghost block" style="margin-top:10px;color:var(--red)" onclick="resetAll()">حذف كل البيانات</button>
    </div>
    <div class="card" style="text-align:center">
      <img src="assets/logo.jpg" style="width:54px;height:54px;border-radius:14px;box-shadow:0 0 22px var(--glow)"/>

      <div class="muted" style="font-size:12px;margin-top:2px">صُنع بهويتك — كل بياناتك محفوظة على جهازك فقط.</div>
    </div>
  </div>`;
}
function setS(k,v){
  if(k==='chime'||k==='vibrate'){ settings[k]= (v===true||v==='true'); }
  else { settings[k] = Math.max(1, parseInt(v)||1); }
  persist();
  if(k==='focusMin' && timer.mode==='focus' && !timer.running){ timer.total=settings.focusMin*60; timer.remain=timer.total; }
  render();
}
function askNotif(){
  if(!('Notification' in window)) return toast('جهازك ما يدعم الإشعارات');
  Notification.requestPermission().then(p=> toast(p==='granted'?'تم تفعيل الإشعارات ✅':'ما تم التفعيل'));
}
function exportData(){
  const blob = new Blob([JSON.stringify({tasks,habits,settings},null,2)], {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`ly-focus-backup-${todayKey()}.json`; a.click();
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(d.tasks) tasks=d.tasks; if(d.habits) habits=d.habits; if(d.settings) settings=d.settings;
    persist(); toast('تم الاسترجاع ✅'); render();
  }catch(e){ toast('الملف غير صالح'); } };
  r.readAsText(f);
}
function resetAll(){
  if(confirm('متأكد تبي تحذف كل المهام والعادات؟')){ localStorage.clear(); location.reload(); }
}

/* ============================ إضافة مهمة / عادة ============================ */
function openAdd(){
  if(tab==='habits') return openAddHabit();
  const ov = sheet(`
    <h3>➕ مهمة جديدة</h3>
    <div class="grp"><label class="lbl">المهمة</label><input id="m_title" placeholder="مثال: مراجعة البريد"/></div>
    <div class="row grp">
      <div style="flex:1"><label class="lbl">الوقت</label><input id="m_time" type="time"/></div>
      <div style="flex:1"><label class="lbl">المدة (دقيقة)</label><input id="m_min" type="number" min="5" placeholder="25"/></div>
    </div>
    <div class="grp"><label class="lbl">الأولوية</label>
      <select id="m_pr"><option value="0">عادية</option><option value="1">مهمة 🔴</option></select></div>
    <button class="btn primary block" onclick="saveTask()">إضافة</button>
  `);
  setTimeout(()=>document.getElementById('m_title').focus(), 100);
}
function saveTask(){
  const t=document.getElementById('m_title').value.trim(); if(!t) return toast('اكتب اسم المهمة');
  tasks.push({ id:id(), title:t, time:document.getElementById('m_time').value,
    min:parseInt(document.getElementById('m_min').value)||0, pr:parseInt(document.getElementById('m_pr').value),
    done:false, date:todayKey() });
  persist(); closeSheet(); render(); buzz(30);
}
function openAddHabit(){
  sheet(`
    <h3>🔥 عادة جديدة</h3>
    <div class="grp"><label class="lbl">العادة</label><input id="h_name" placeholder="مثال: قراءة 10 صفحات"/></div>
    <div class="grp"><label class="lbl">رمز (اختياري)</label><input id="h_icon" placeholder="📚" maxlength="2"/></div>
    <button class="btn primary block" onclick="saveHabit()">إضافة</button>
  `);
  setTimeout(()=>document.getElementById('h_name').focus(), 100);
}
function saveHabit(){
  const n=document.getElementById('h_name').value.trim(); if(!n) return toast('اكتب اسم العادة');
  habits.push({ id:id(), icon:document.getElementById('h_icon').value.trim()||'✨', name:n, note:'', log:{}, on:true });
  persist(); closeSheet(); render(); buzz(30);
}

/* ---- sheet helpers ---- */
function sheet(html){
  closeSheet();
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='ov';
  ov.onclick=(e)=>{ if(e.target===ov) closeSheet(); };
  ov.innerHTML=`<div class="sheet">${html}</div>`;
  document.body.appendChild(ov); return ov;
}
function closeSheet(){ const o=document.getElementById('ov'); if(o) o.remove(); }

function esc(s){ return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================ تشغيل ============================ */
render();
go('today');
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
