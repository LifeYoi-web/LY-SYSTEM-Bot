# Easiest way to run Lavalink on your VPS. From this folder: `docker compose up -d`.
# Keep application.yml next to this file; it gets mounted into the container.
services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx1G # cap heap; raise if you have RAM to spare
      - SERVER_PORT=2333
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
      - ./plugins/:/opt/Lavalink/plugins/
    ports:
      - "2333:2333"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2333 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
